# The bindings the worker expects. The real wrangler.toml is not published:
# it carries the Access audience, operator addresses and a Stripe price id.
name = "learners-permit-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"            # tables: laws, penalties, learner_questions, ... (schema.sql)
database_name = "learners-permit"
database_id = "<your D1 id>"

[[vectorize]]
binding = "LAWS"          # index howard-laws: 1024 dimensions, cosine, one namespace per state
index_name = "howard-laws"

[ai]
binding = "AI"            # @cf/baai/bge-m3 for embeddings

[[r2_buckets]]
binding = "KB"
bucket_name = "learners-permit-kb"

[[services]]
binding = "COARSE"        # the sibling worker the MCP mesh asks (docs/plans/ask-mcp-architecture.md)
service = "ask-coarse"

[vars]
ALLOWED_ORIGINS = "https://howardslantern.com,https://www.howardslantern.com"
# Secrets, set with `wrangler secret put`: ANTHROPIC_API_KEY, TURNSTILE_SECRET
